[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-leads-test"
version = "0.1.0"
description = "Independent business lead checks restricted to Samara"
requires-python = ">=3.12"
dependencies = [
  "pytest==9.1.1",
  "playwright==1.62.0",
  "pytest-timeout==2.4.0",
  "allure-pytest==2.16.0",
]

[tool.setuptools.packages.find]
include = ["business*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/browser"]
addopts = "-ra"
timeout = 90
markers = ["live: real landing business submissions; requires explicit environment"]
