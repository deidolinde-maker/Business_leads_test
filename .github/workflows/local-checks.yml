name: Local runner checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: Check local fixtures only
        run: python -m pytest tests/unit tests/browser --junitxml=artifacts/local-tests.xml --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-check-results
          path: |
            artifacts/
            allure-results/
